ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.yeyint.recipeapp.backend.ApplicationKt.module ]
    }
}

app {
    database {
        url = "jdbc:postgresql://localhost:5432/recipeapp"
        url = ${?DATABASE_URL}
        user = "recipeapp"
        user = ${?DATABASE_USER}
        password = "recipeapp"
        password = ${?DATABASE_PASSWORD}
        maxPoolSize = "10"
        maxPoolSize = ${?DATABASE_POOL_SIZE}
    }
    jwt {
        # MUST be overridden in production via JWT_SECRET.
        secret = "dev-only-secret-change-me"
        secret = ${?JWT_SECRET}
        issuer = "recipeapp-backend"
        issuer = ${?JWT_ISSUER}
        audience = "recipeapp-mobile"
        audience = ${?JWT_AUDIENCE}
        accessTtlMinutes = "15"
        accessTtlMinutes = ${?JWT_ACCESS_TTL_MINUTES}
        refreshTtlDays = "30"
        refreshTtlDays = ${?JWT_REFRESH_TTL_DAYS}
    }
    admin {
        # Bootstrap admin account, created on first start if missing.
        email = "admin@recipeapp.dev"
        email = ${?ADMIN_EMAIL}
        password = "Admin123!"
        password = ${?ADMIN_PASSWORD}
        name = "Administrator"
    }
    cors {
        # Comma-separated list of allowed origins ("*" only for development).
        allowedHosts = "*"
        allowedHosts = ${?CORS_ALLOWED_HOSTS}
    }
}
